<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>བྲིས་ཡིག チベット書道練習帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tibetan:wght@400;700&family=Zen+Old+Mincho:wght@500;700&display=swap">
<style>
:root{--bg:#EDE7DC;--panel:#F7F3EA;--text:#241B17;--muted:#6B5D52;--line:#CFC4B3;--accent:#8C2A33;--gold:#C98A1B;--board:#1C1714;--ink:#F3E6C4;--guide:rgba(243,230,196,.2);
--sans:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--tib:"Noto Serif Tibetan","Jomolhari","Tibetan Machine Uni","Microsoft Himalaya",serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14100E;--panel:#211A17;--text:#EFE5D3;--muted:#A89987;--line:#3A2F29;--accent:#D86A72}}
:root[data-theme="dark"]{--bg:#14100E;--panel:#211A17;--text:#EFE5D3;--muted:#A89987;--line:#3A2F29;--accent:#D86A72}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.7}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:1.5rem;font-weight:700}
h1 span{font-family:var(--tib);color:var(--accent);margin-right:10px;font-size:1.7rem}
header p{margin:0;color:var(--muted);font-size:.9rem}
.layout{display:grid;grid-template-columns:260px 1fr;gap:16px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button,.tools button,.tools select{font:inherit;font-size:.9rem;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
.tabs button[aria-pressed="true"],.tools button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:420px;overflow-y:auto}
@media(max-width:760px){.grid{grid-template-columns:repeat(6,1fr);max-height:190px}}
.cell{font-family:var(--tib);font-size:1.6rem;line-height:1.5;text-align:center;padding:2px 0;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text);cursor:pointer}
.cell[aria-pressed="true"]{background:var(--board);color:var(--ink);border-color:var(--gold)}
.cell.word{grid-column:span 5;font-size:1.3rem;text-align:left;padding:4px 10px}
@media(max-width:760px){.cell.word{grid-column:span 6}}
.stage-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.cur{font-family:var(--tib);font-size:2rem;line-height:1.4;color:var(--accent)}
.rom{color:var(--muted);font-size:.95rem}
.board{position:relative;background:var(--board);border-radius:8px;border:6px solid #3B2A20;aspect-ratio:4/3;touch-action:none;overflow:hidden}
.board.paper{background:#F4F4EF;border-color:#B9A98F}
.board canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tools label{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
.tools input[type=range]{width:110px;accent-color:var(--accent)}
.tools .sp{flex:1}
.hint{margin:10px 0 0;color:var(--muted);font-size:.85rem}
.read h2{margin:0 0 4px;font-size:1.2rem}
.read p{margin:4px 0}
.legend,.parts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:1px 9px 1px 7px;font-size:.82rem;border:1px solid var(--line);border-left:5px solid var(--c)}
.chip b{font-family:var(--tib);font-size:1.35rem;font-weight:400;line-height:1.5}
.r-pre{--c:#5F78A8}.r-sup{--c:#3F9473}.r-root{--c:#B3343F}.r-sub{--c:#C08A16}.r-vow{--c:#8559B5}.r-suf{--c:#2A82A0}.r-suf2{--c:#808890}
.syls{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.syl{flex:1 1 230px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.syl .big{font-family:var(--tib);font-size:2.4rem;line-height:1.5}
.syl .rd{font-weight:700}
.syl .nt{color:var(--muted);font-size:.9rem}
.read{margin-top:16px}
.read details{border-top:1px solid var(--line);padding:8px 0}
.read summary{cursor:pointer;font-weight:700}
.read details p,.read details li{font-size:.95rem}
#lang{font:inherit;font-size:.9rem;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1><span>བྲིས་ཡིག</span>チベット書道練習帳</h1>
<p></p>
<select id="lang" aria-label="Language"></select>
</header>
<div class="layout">
<section class="panel" aria-label="文字を選ぶ">
<div class="tabs" role="group" aria-label="種類">
<button data-set="cons" aria-pressed="true">子音</button>
<button data-set="vow" aria-pressed="false">母音</button>
<button data-set="stack" aria-pressed="false">重ね字</button>
<button data-set="skt" aria-pressed="false">梵字</button>
<button data-set="num" aria-pressed="false">数字</button>
<button data-set="word" aria-pressed="false">言葉</button>
</div>
<div class="grid" id="grid"></div>
</section>
<section class="panel" aria-label="練習ボード">
<div class="stage-head"><div class="cur" id="cur">ཀ</div><div class="rom" id="rom">ka</div></div>
<div class="board" id="board">
<canvas id="guide"></canvas>
<canvas id="draw" tabindex="0" aria-label="書き込み領域"></canvas>
</div>
<div class="tools">
<button id="undo">一つ戻す</button>
<button id="clear">全部消す</button>
<button id="toggleGuide" aria-pressed="true">お手本</button>
<button id="toggleLine" aria-pressed="true">頭線</button>
<button id="toggleSurface" aria-pressed="false">紙に切り替え</button>
<span class="sp"></span>
<label>筆の太さ <input type="range" id="size" min="4" max="26" value="12"></label>
</div>
<p class="hint">チベット文字は、文字の上にある横線(頭線)から字が下がるように書きます。上の線に合わせて書いてみてください。</p>
</section>
</div>
<section class="panel read" id="read" aria-label="読み方">
<h2>読み方のしくみ</h2>
<p id="readLead"></p>
<div class="legend" id="legend"></div>
<div class="syls" id="syls"></div>
<div id="rules"></div>
</section>
</div>

  (evs.length?evs:[e]).forEach(ev=>{
    const pt=pos(ev);pt.t=ev.timeStamp;
    const w=widthFor(last,pt);
    const steps=Math.max(1,Math.ceil(Math.hypot(pt.x-last.x,pt.y-last.y)/(w*0.25)));
    dx.fillStyle=inkColor();
    for(let i=1;i<=steps;i++){
      const k=i/steps,x=last.x+(pt.x-last.x)*k,y=last.y+(pt.y-last.y)*k,ww=lastW+(w-lastW)*k;
      dx.beginPath();dx.ellipse(x,y,ww/2,ww/2*0.85,-0.6,0,Math.PI*2);dx.fill();
    }
    lastW=w;last=pt;
  });
});
['pointerup','pointercancel'].forEach(n=>dC.addEventListener(n,()=>{drawing=false}));

$('undo').onclick=()=>{const s=history.pop();clearDraw();if(s)dx.putImageData(s,0,0)};
$('clear').onclick=()=>{snap();clearDraw()};
$('size').oninput=e=>{size=+e.target.value};
$('toggleGuide').onclick=e=>{showGuide=!showGuide;e.currentTarget.setAttribute('aria-pressed',showGuide);drawGuide()};
$('toggleLine').onclick=e=>{showLine=!showLine;e.currentTarget.setAttribute('aria-pressed',showLine);drawGuide()};
$('toggleSurface').onclick=e=>{
  paper=!paper;e.currentTarget.setAttribute('aria-pressed',paper);
  applyLang();
  board.classList.toggle('paper',paper);
  // recolor existing strokes
  dx.globalCompositeOperation='source-in';dx.fillStyle=inkColor();dx.fillRect(0,0,dC.width,dC.height);dx.globalCompositeOperation='source-over';
  history=[];drawGuide();
};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  setName=b.dataset.set;cur=SETS[setName][0];
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  history=[];clearDraw();buildGrid();setCur();drawGuide();
});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const keep=dx.getImageData(0,0,dC.width,dC.height);const ow=dC.width,oh=dC.height;const tmp=document.createElement('canvas');tmp.width=ow;tmp.height=oh;tmp.getContext('2d').putImageData(keep,0,0);resize();dx.drawImage(tmp,0,0,dC.width,dC.height)},150)});
buildGrid();setCur();resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawGuide);
applyLang();
</script>
</body>
